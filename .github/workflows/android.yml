name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  test:
    name: Headless smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import assets
        run: godot --headless --path . --import

      - name: Run smoke test
        run: godot --headless --path . res://tests/SmokeTest.tscn

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Godot and export templates
        run: |
          curl -sSLo godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSLo templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Point Godot at the Android SDK and keystore
        run: |
          # Godot reads the SDK path and debug signing details from editor
          # settings, which do not exist on a fresh runner -- write them before
          # exporting. (A heredoc here would indent the file contents, so build
          # it line by line.)
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          SETTINGS="$SETTINGS_DIR/editor_settings-4.3.tres"
          echo '[gd_resource type="EditorSettings" format=3]' > "$SETTINGS"
          echo '' >> "$SETTINGS"
          echo '[resource]' >> "$SETTINGS"
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> "$SETTINGS"
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> "$SETTINGS"
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$SETTINGS"
          echo 'export/android/debug_keystore_pass = "android"' >> "$SETTINGS"
          cat "$SETTINGS"

      - name: Import assets
        run: godot --headless --path . --import

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/skate.apk
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: skate-debug-apk
          path: build/skate.apk
          if-no-files-found: error
